<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trolley Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Clusters -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database-compat.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root {
  /* --- UNIFIED THEME (Clean & Technical) --- */
  --bg-body: #000000;
  --bg-surface: #1C1C1E; /* Standard iOS Dark Gray */
  --bg-input: #2C2C2E;
  
  --text-primary: #FFFFFF;
  --text-secondary: #8E8E93;
  
  /* Single Accent Color for EVERYTHING */
  --accent: #0A84FF; 
  --accent-dim: rgba(10, 132, 255, 0.15);
  
  --success: #30D158;
  --danger: #FF453A;
  
  --border: rgba(255, 255, 255, 0.1);
  --radius: 16px;
  
  --anim: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background-color: var(--bg-body);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  overflow: hidden;
  font-size: 15px;
}

/* --- SHARED UTILITIES --- */
.trolley-icon-svg { width: 100%; height: 100%; display: block; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.muted { color: var(--text-secondary); }

/* Clean Card Style */
.app-card {
  background: var(--bg-surface);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
}

/* Buttons */
button { border: none; cursor: pointer; font-family: inherit; transition: transform 0.1s; outline: none; }
button:active { transform: scale(0.96); }

.btn-primary {
  background: var(--accent);
  color: white;
  padding: 14px 20px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15px;
  width: 100%;
}

.btn-ghost {
  background: transparent;
  color: var(--accent);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 500;
  font-size: 14px;
}

.btn-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* Inputs */
input, select {
  background: var(--bg-input);
  border: none;
  color: white; padding: 14px;
  border-radius: 12px; width: 100%;
  font-size: 16px; outline: none;
}
input:focus { box-shadow: 0 0 0 2px var(--accent); }

/* --- HEADER --- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 16px 20px;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

/* --- PAGES --- */
.page {
  position: absolute; inset: 0;
  padding: 80px 20px 100px 20px;
  overflow-y: auto;
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s;
}
.page.active { opacity: 1; visibility: visible; }

/* --- LIST ITEMS --- */
.item-card {
  background: var(--bg-surface);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.item-img {
  width: 48px; height: 48px; border-radius: 10px;
  background: var(--bg-input);
  padding: 10px;
  display: flex; align-items: center; justify-content: center;
}
.item-content { flex: 1; }
.item-title { font-weight: 600; margin-bottom: 2px; }
.item-sub { font-size: 13px; color: var(--text-secondary); }

/* --- MAP --- */
#map-container {
  width: 100%; height: 100%;
  border-radius: 0; /* Full bleed map looks cleaner on simple designs */
  position: relative;
}
#map { width: 100%; height: 100%; background: #121212; }

/* Cluster Styles */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(10, 132, 255, 0.2); }
.marker-cluster div { background-color: var(--accent); color: white; font-weight: bold; font-family: 'Inter', sans-serif; }

/* Tooltip */
.custom-tooltip {
    background: var(--bg-surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    padding: 0 !important;
    color: white !important;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5) !important;
    font-family: 'Inter', sans-serif !important;
    min-width: 200px;
}
.leaflet-tooltip-top:before { display: none !important; }

.tt-header { 
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
}
.tt-title { font-weight: 600; font-size: 14px; }
.tt-badge { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.tt-badge.active { background: rgba(48, 209, 88, 0.2); color: var(--success); }
.tt-badge.inactive { background: rgba(255, 69, 58, 0.2); color: var(--danger); }

.tt-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.tt-row { display: flex; justify-content: space-between; font-size: 13px; }
.tt-label { color: var(--text-secondary); }
.tt-value { font-weight: 600; font-family: 'JetBrains Mono', monospace; }

/* --- NAV DOCK --- */
.nav-dock {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--bg-surface);
  padding: 6px; border-radius: 100px;
  display: flex; gap: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  z-index: 1000;
}
.nav-item {
  padding: 12px 24px; border-radius: 100px;
  color: var(--text-secondary); font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav-item.active { background: var(--accent); color: white; }

/* --- WAYFINDING OVERLAY (Synced Design) --- */
#wayfinding-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: var(--bg-body);
    display: none; flex-direction: column;
    padding: 60px 20px 40px 20px;
}
#wayfinding-overlay.active { display: flex; }

/* Minimal Compass */
.wf-compass-wrapper {
    position: relative; width: 280px; height: 280px;
    margin: auto; display: flex; align-items: center; justify-content: center;
}
.wf-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--bg-input);
}
.wf-ticks { position: absolute; inset: 10px; }
.wf-tick { position: absolute; top: 0; left: 50%; width: 2px; height: 10px; background: var(--bg-input); transform-origin: center 130px; }

.wf-arrow-container {
    width: 80px; height: 80px; z-index: 10;
    background: var(--accent);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px var(--accent-dim);
    transition: transform 0.1s linear;
}
.wf-arrow-icon { width: 32px; height: 32px; fill: none; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

.wf-stats { text-align: center; margin-bottom: 20px; }
.wf-dist { font-family: 'JetBrains Mono', monospace; font-size: 60px; font-weight: 600; line-height: 1; }
.wf-label { color: var(--text-secondary); font-size: 14px; letter-spacing: 1px; margin-top: 8px; }

/* --- MODALS --- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-content {
  background: var(--bg-surface); width: 90%; max-width: 340px;
  border-radius: var(--radius); padding: 24px;
  border: 1px solid var(--border);
}

/* --- TOAST --- */
#toast {
    position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px);
    background: var(--bg-surface); border: 1px solid var(--border);
    color: white; padding: 12px 24px; border-radius: 50px;
    font-weight: 500; transition: 0.4s; z-index: 4000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
</style>
</head>

<!-- 1. HOME PAGE -->

<!-- WAYFINDING OVERLAY (Clean Version) -->
<div id="wayfinding-overlay">

<script>
// --- LOGIC (Identical) ---
const FIXED_ZONE_RADIUS = 50;
let map, clusters, beacons = [], zones = {}, idToMarker = new Map(), zoneCircles = {};
let selectedBeacon = null, placementMode = null, tempPayload = null, watchId = null;
let userLat = null, userLng = null, userMarker = null;

const getTrolleyIcon = () => document.getElementById('tpl-icon').innerHTML;

function generateTicks() {
    const container = document.getElementById('wfTicks');
    let html = '';
    for(let i=0; i<360; i+=30) {
        html += `<div style="position:absolute;top:0;left:50%;width:2px;height:10px;background:#333;transform-origin:center 140px;transform:rotate(${i}deg);"></div>`;
    }
    container.innerHTML = html;
}

function init(){
    generateTicks();
    // Map
    map = L.map('map', { zoomControl: false }).setView([1.3455, 103.9323], 17);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OSM &copy; CartoDB', subdomains: 'abcd', maxZoom: 20
    }).addTo(map);
    clusters = L.markerClusterGroup({ showCoverageOnHover: false, disableClusteringAtZoom: 19 });
    map.addLayer(clusters);

    document.getElementById('cardIconContainer').innerHTML = getTrolleyIcon();

    // Firebase
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyCYE1hpoQV_QlfhQz7hlZResGuunbY1DG0",
            authDomain: "trolley-tracking-678c5.firebaseapp.com",
            databaseURL: "https://trolley-tracking-678c5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "trolley-tracking-678c5",
            storageBucket: "trolley-tracking-678c5.appspot.com",
            messagingSenderId: "830477552391",
            appId: "1:830477552391:web:558930d01a8f594a3953a2"
        };
        if (typeof firebase !== 'undefined' && firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        db.ref("/Tracking").on("value", snap => {
            const data = snap.val() || {};
            beacons = Object.keys(data).map(k => ({
                id: k, zone: data[k].zoneId || "",
                lat: data[k].latitude || data[k].lat,
                lng: data[k].longitude || data[k].lng,
                raw: data[k]
            }));
            updateUI();
        });
        db.ref("/Zones").on("value", snap => {
            const data = snap.val() || {};
            zones = {};
            Object.keys(data).forEach(k => {
                if(data[k].centerLat) zones[k] = [data[k].centerLat, data[k].centerLng];
            });
            updateUI();
        });
    } catch(e) { console.error(e); }

    if(navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            userLat = pos.coords.latitude; userLng = pos.coords.longitude;
            if(!userMarker) {
                userMarker = L.circleMarker([userLat, userLng], { radius: 8, color: '#FFF', fillColor: '#0A84FF', fillOpacity: 1, weight: 2 }).addTo(map);
                userMarker.bindPopup("You");
            } else userMarker.setLatLng([userLat, userLng]);
        }, err => console.warn("Loc Denied"), { enableHighAccuracy: true });
    }
    setupInteractions();
}

function updateUI(){
    renderList();
    renderMap();
    document.getElementById("statBeaconCount").innerText = beacons.length;
    document.getElementById("statZoneCount").innerText = Object.keys(zones).length || new Set(beacons.map(b=>b.zone)).size;
    document.getElementById('lastSyncText').innerText = "Sync: " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function renderList(){
    const listEl = document.getElementById("homeList");
    const filter = document.getElementById("zoneFilter").value;
    const filtered = beacons.filter(b => !filter || b.zone === filter);
    
    document.getElementById("homeEmpty").style.display = filtered.length ? 'none' : 'block';
    listEl.innerHTML = filtered.map(b => `
        <div class="item-card" onclick="viewOnMap('${b.id}')">
            <div class="item-img">${getTrolleyIcon()}</div>
            <div class="item-content">
                <div class="item-title">${b.zone || 'Unassigned'}</div>
                <div class="item-sub">ID: ${b.id}</div>
            </div>
            <div style="color:var(--accent)">→</div>
        </div>
    `).join('');

    const sel = document.getElementById("zoneFilter");
    const knownZones = [...new Set([...beacons.map(b=>b.zone), ...Object.keys(zones)])].filter(Boolean).sort();
    const curr = sel.value;
    sel.innerHTML = `<option value="">All Zones</option>` + knownZones.map(z => `<option value="${z}">${z}</option>`).join('');
    sel.value = curr;
}

function renderMap(){
    clusters.clearLayers();
    idToMarker.clear();
    const zoneFilter = document.getElementById("zoneFilter").value;

    beacons.forEach(b => {
        if(zoneFilter && b.zone !== zoneFilter) return;
        if(selectedBeacon && b.id !== selectedBeacon.id) return;
        if(!b.lat || !b.lng) return;
        
        // Updated to Blue (#0A84FF)
        const m = L.circleMarker([b.lat, b.lng], {
            radius: 8, color: '#0A84FF', fillColor: '#0A84FF', fillOpacity: 0.8, weight: 2
        });
        
        const lastSeen = b.raw.timestamp ? new Date(b.raw.timestamp) : new Date();
        const timeStr = lastSeen.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const isRecent = (Date.now() - lastSeen.getTime()) < 1000 * 60 * 60;

        const tooltipHtml = `
            <div class="tt-header">
                <span class="tt-title">${b.id}</span>
                <span class="tt-badge ${isRecent ? 'active' : 'inactive'}">${isRecent ? 'LIVE' : 'OFF'}</span>
            </div>
            <div class="tt-body">
                <div class="tt-row"><span class="tt-label">Zone</span><span class="tt-value">${b.zone}</span></div>
                <div class="tt-row"><span class="tt-label">Signal</span><span class="tt-value">${b.raw.rssi || '--'} dBm</span></div>
                <div class="tt-row"><span class="tt-label">Battery</span><span class="tt-value">${b.raw.battery || '--'}%</span></div>
            </div>
            <div class="tt-footer"><span>${timeStr}</span></div>
        `;
        
        m.bindTooltip(tooltipHtml, { direction: 'top', className: 'custom-tooltip', offset: [0, -10] });
        m.on('click', (e) => { L.DomEvent.stopPropagation(e); selectBeacon(b); });
        clusters.addLayer(m);
        idToMarker.set(b.id, m);
    });

    if(userMarker) userMarker.addTo(map);
    
    Object.keys(zoneCircles).forEach(k => map.removeLayer(zoneCircles[k]));
    zoneCircles = {};
    if(!selectedBeacon) {
        Object.keys(zones).forEach(zKey => {
            if(zoneFilter && zoneFilter !== zKey) return;
            zoneCircles[zKey] = L.circle(zones[zKey], {
                radius: FIXED_ZONE_RADIUS, color: '#30D158', fillColor: '#30D158', fillOpacity: 0.05, weight: 1
            }).addTo(map);
        });
    }
}

async function scanBLE() {
    if (!selectedBeacon) return;
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ name: selectedBeacon.id }] });
        showToast(`Connected: ${device.name}`);
    } catch (error) { showToast("Scan Cancelled"); }
}

function setupInteractions(){
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
            if(btn.dataset.page === 'map') setTimeout(()=> map.invalidateSize(), 300);
        };
    });

    document.getElementById('hdr-add').onclick = () => document.getElementById('modalAdd').style.display = 'flex';
    document.getElementById('btnFinderBle').onclick = scanBLE;
    document.getElementById('btnAddZone').onclick = () => document.getElementById('modalZone').style.display = 'flex';
    
    document.getElementById('btnAddConfirm').onclick = () => {
        const z = document.getElementById('inpZone').value;
        const id = document.getElementById('inpId').value;
        if(!z || !id) return showToast("Fill all fields");
        tempPayload = { zoneId: z, trolleyId: id };
        placementMode = 'beacon';
        closeModals();
        switchToMapAndGuide("Tap map to place trolley");
    };

    document.getElementById('btnAddZoneConfirm').onclick = () => {
        const z = document.getElementById('inpZoneName').value;
        if(!z) return showToast("Name required");
        tempPayload = { zoneId: z };
        placementMode = 'zone';
        closeModals();
        switchToMapAndGuide("Tap map to set zone center");
    };

    map.on('click', e => {
        if(placementMode){
            const { lat, lng } = e.latlng;
            if(placementMode === 'beacon'){
                firebase.database().ref(`/Tracking/${tempPayload.trolleyId}`).set({
                    ...tempPayload, latitude: lat, longitude: lng, timestamp: new Date().toISOString()
                });
                showToast("Beacon Added");
            } else if (placementMode === 'zone'){
                firebase.database().ref(`/Zones/${tempPayload.zoneId}`).set({
                    zoneId: tempPayload.zoneId, centerLat: lat, centerLng: lng
                });
                showToast("Zone Created");
            }
            placementMode = null;
            return;
        }
        if(selectedBeacon) deselectBeacon();
    });

    document.getElementById('mapSearch').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const found = beacons.find(b => b.id.toLowerCase().includes(term) || b.zone.toLowerCase().includes(term));
        if(found) selectBeacon(found);
    };
    
    document.getElementById('mc_close').onclick = deselectBeacon;
    document.getElementById('mc_del').onclick = () => {
        if(confirm("Delete beacon?")){
            firebase.database().ref(`/Tracking/${selectedBeacon.id}`).remove();
            deselectBeacon();
        }
    };

    document.getElementById('mc_find').onclick = startCompass;
    document.getElementById('zoneFilter').onchange = updateUI;
    document.getElementById('mapRecenter').onclick = () => {
        if(userLat && userLng) { map.flyTo([userLat, userLng], 18); showToast("Locating..."); }
        else { showToast("Waiting for GPS..."); }
    };

    // Fixed listener assignment
    document.getElementById('btnStopFind').onclick = stopCompass;
}

function switchToMapAndGuide(msg){
    document.querySelector('[data-page="map"]').click();
    showToast(msg);
}
function viewOnMap(id){
    const b = beacons.find(x => x.id === id);
    if(b){
        document.querySelector('[data-page="map"]').click();
        setTimeout(() => selectBeacon(b), 400);
    }
}
function selectBeacon(b){
    selectedBeacon = b;
    map.flyTo([b.lat, b.lng], 18);
    document.getElementById('mc_name').innerText = b.id;
    document.getElementById('mc_zone').innerText = b.zone || "No Zone";
    document.getElementById('mapCard').style.transform = 'translateY(0)';
    renderMap();
}
function deselectBeacon(){
    selectedBeacon = null;
    document.getElementById('mapCard').style.transform = 'translateY(150%)';
    renderMap();
}
function closeModals(){ document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none'); }
function showToast(msg){
    const t = document.getElementById('toast'); t.innerText = msg;
    t.style.transform = 'translate(-50%, 80px)';
    setTimeout(() => t.style.transform = 'translate(-50%, -100px)', 3000);
}

// --- COMPASS ---
function startCompass(){
    if(!selectedBeacon) return;
    document.getElementById('mapCard').style.transform = 'translateY(150%)';
    document.getElementById('wayfinding-overlay').classList.add('active');
    document.getElementById('findTargetName').innerText = selectedBeacon.id;

    if(navigator.geolocation){
        watchId = navigator.geolocation.watchPosition(processPosition, console.error, {enableHighAccuracy:true});
        window.addEventListener('deviceorientation', processOrientation, true);
    }
}

function stopCompass(){
    document.getElementById('wayfinding-overlay').classList.remove('active');
    if(selectedBeacon) document.getElementById('mapCard').style.transform = 'translateY(0)';
    if(watchId) navigator.geolocation.clearWatch(watchId);
    window.removeEventListener('deviceorientation', processOrientation, true);
}

let currentHeading = 0;
function processOrientation(e){
    if(e.webkitCompassHeading) currentHeading = e.webkitCompassHeading;
    else if(e.alpha) currentHeading = 360 - e.alpha;
}
function processPosition(pos){
    if(!selectedBeacon) return;
    const { latitude, longitude } = pos.coords;
    userLat = latitude; userLng = longitude;
    const destLat = selectedBeacon.lat;
    const destLng = selectedBeacon.lng;
    const R = 6371e3;
    const φ1 = latitude * Math.PI/180, φ2 = destLat * Math.PI/180;
    const Δφ = (destLat-latitude) * Math.PI/180, Δλ = (destLng-longitude) * Math.PI/180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2) * Math.sin(Δλ/2)**2;
    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    document.getElementById('findDistVal').innerText = Math.round(d);
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    const rotation = brng - currentHeading;
    document.getElementById('finderArrow').style.transform = `rotate(${rotation}deg)`;
}

window.onload = init;
</script>
