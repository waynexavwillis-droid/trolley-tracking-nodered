<style>
/* --- THEME VARIABLES --- */
:root {
  /* Light Mode (Default) */
  --bg-app: #F2F2F7;
  --bg-panel: #FFFFFF;
  --text-main: #000000;
  --text-sub: #3C3C43;
  --text-muted: #8E8E93;
  
  --accent: #F2994A;
  --accent-grad: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%);
  --danger: #FF3B30;
  
  --glass: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  
  --map-bg: #EBEBEB;
  
  --anim: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Dark Mode Overrides */
body.dark {
  --bg-app: #000000;
  --bg-panel: #1C1C1E;
  --text-main: #FFFFFF;
  --text-sub: #EBEBF5;
  --text-muted: #98989D;
  
  --glass: rgba(28, 28, 30, 0.85);
  --glass-border: rgba(255, 255, 255, 0.12);
  --shadow: 0 10px 40px -10px rgba(0,0,0,0.6);
  
  --map-bg: #121212;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  overflow: hidden;
  transition: background-color 0.4s ease, color 0.4s ease;
}

/* --- ICONS --- */
.trolley-icon-svg { width: 100%; height: 100%; display: block; }
/* Auto-color the basket lines based on theme */
.icon-basket { stroke: var(--text-main); transition: stroke 0.4s; }

/* --- UI COMPONENTS --- */
h1, h2, h3 { margin: 0; font-weight: 700; }
.small { font-size: 13px; }
.muted { color: var(--text-muted); }

.pill {
  padding: 4px 12px;
  background: var(--bg-app);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
  font-size: 11px; font-weight: 600;
}

/* Buttons */
button { border: none; cursor: pointer; font-family: inherit; transition: var(--anim); outline: none; }
button:active { transform: scale(0.96); }

.btn-primary {
  background: var(--accent-grad); color: black;
  padding: 12px 24px; border-radius: 100px;
  font-weight: 700; font-size: 14px;
  box-shadow: 0 4px 15px rgba(242, 153, 74, 0.35);
}
.btn-ghost {
  background: var(--bg-app); color: var(--text-main);
  padding: 10px 20px; border-radius: 100px;
  font-size: 13px; font-weight: 600;
}
.btn-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-panel); color: var(--text-main);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; box-shadow: var(--shadow);
}

input, select {
  background: var(--bg-app);
  border: 1px solid var(--glass-border);
  color: var(--text-main); padding: 14px 18px;
  border-radius: 18px; width: 100%;
  font-size: 14px; outline: none;
  transition: var(--anim);
}

/* --- HEADER --- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 16px 20px;
  background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: space-between;
}

/* --- PAGES --- */
.page {
  position: absolute; inset: 0;
  padding: 80px 20px 120px 20px; /* Top for header, bottom for nav */
  overflow-y: auto;
  opacity: 0; visibility: hidden; transform: scale(0.98);
  transition: var(--anim);
}
.page.active { opacity: 1; visibility: visible; transform: scale(1); }

/* --- CARDS & LISTS --- */
.app-card {
  background: var(--bg-panel); border-radius: 28px;
  padding: 20px; margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.item-card {
  background: var(--bg-panel); border-radius: 20px;
  padding: 12px; display: flex; align-items: center; gap: 14px;
  transition: var(--anim); cursor: pointer;
  border: 1px solid var(--glass-border);
  margin-bottom: 12px;
}
.item-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.item-img {
  width: 54px; height: 54px; border-radius: 16px;
  background: var(--bg-app);
  display: flex; align-items: center; justify-content: center;
}

/* --- MAP --- */
#map-container {
  width: 100%; height: 100%;
  border-radius: 32px; overflow: hidden; position: relative;
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
}
#map { width: 100%; height: 100%; background: var(--map-bg); }

/* --- BOTTOM NAV --- */
.nav-dock {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--glass); backdrop-filter: blur(20px);
  padding: 6px; border-radius: 100px;
  display: flex; gap: 8px;
  box-shadow: var(--shadow); z-index: 100;
  border: 1px solid var(--glass-border);
}
.nav-item {
  width: 50px; height: 50px; border-radius: 50%;
  color: var(--text-muted); font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--anim);
}
.nav-item.active { background: var(--text-main); color: var(--bg-panel); }

/* --- SWITCH TOGGLE --- */
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background-color: #e4e4e4; border-radius: 34px; transition: .4s;
}
body.dark .slider { background-color: #333; }
.slider:before {
  position: absolute; content: ""; height: 20px; width: 20px;
  left: 4px; bottom: 4px; background-color: white;
  border-radius: 50%; transition: .4s;
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(22px); }

/* --- NAVIGATION UI (Squircle Style) --- */
#finder-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    display: none; /* Hidden by default */
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 50px;
}

/* 1. Floating Meter */
.finder-meter {
    background: var(--accent-grad);
    padding: 10px 30px;
    border-radius: 24px;
    text-align: center;
    margin-bottom: -30px; /* Overlap the square */
    z-index: 5;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transform: translateY(0);
    animation: slideDown 0.5s ease;
}
.finder-val { font-size: 42px; font-weight: 800; color: black; line-height: 1; }
.finder-unit { font-size: 14px; font-weight: 600; color: rgba(0,0,0,0.7); text-transform: uppercase; }

/* 2. The Squircle Container */
.finder-squircle {
    width: 320px; height: 320px;
    background: var(--glass);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 60px; /* The "Round like square" */
    border: 4px solid rgba(255,255,255,0.1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}

/* 3. The Compass Inside */
.compass-dial {
    width: 260px; height: 260px;
    position: absolute;
    border-radius: 50%;
    border: 1px dashed var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s linear; /* Smooth rotation */
}

/* Ticks */
.tick {
    position: absolute; width: 2px; height: 10px;
    background: var(--text-muted);
    left: 50%; top: 0; transform-origin: 50% 130px; /* radius */
}
.tick.N { height: 20px; width: 4px; background: var(--danger); }

/* Target Arrow (Fixed in center visually, dial moves) */
.center-arrow {
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 40px solid var(--accent);
    margin-bottom: 10px;
}

/* Stop Button */
.btn-stop {
    position: absolute; bottom: 30px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--text-main); color: var(--bg-panel);
    font-size: 24px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    z-index: 10;
}

/* --- MODALS --- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-content {
  background: var(--bg-panel); width: 85%; max-width: 360px;
  border-radius: 32px; padding: 24px;
  box-shadow: var(--shadow);
}

/* Leaflet Overrides */
.leaflet-popup-content-wrapper { background: var(--bg-panel); color: var(--text-main); border-radius: 16px; }
.leaflet-popup-tip { background: var(--bg-panel); }
</style>
</head>

<script>
/* --- GLOBAL STATE --- */
let map, clusters, beacons = [], zones = {}, selectedBeacon = null, watchId = null, currentTileLayer = null;

/* --- INITIALIZATION --- */
function init() {
    console.log("App initializing...");

    // 1. Apply Theme immediately
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'dark') {
        document.body.classList.add('dark');
        if(document.getElementById('themeToggle')) document.getElementById('themeToggle').checked = true;
    }

    // 2. Setup Map
    map = L.map('map', { zoomControl: false }).setView([1.3455, 103.9323], 17);
    clusters = L.markerClusterGroup({ showCoverageOnHover: false });
    map.addLayer(clusters);
    updateMapTiles();

    // 3. Setup Firebase
    try {
        const config = {
            apiKey: "AIzaSyCYE1hpoQV_QlfhQz7hlZResGuunbY1DG0",
            authDomain: "trolley-tracking-678c5.firebaseapp.com",
            databaseURL: "https://trolley-tracking-678c5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "trolley-tracking-678c5",
            appId: "1:830477552391:web:558930d01a8f594a3953a2"
        };
        if(!firebase.apps.length) firebase.initializeApp(config);
        const db = firebase.database();

        // Listen for Data
        db.ref("/Tracking").on("value", snap => {
            const val = snap.val();
            if(!val) { beacons = []; updateUI(); return; }
            
            beacons = Object.keys(val).map(k => {
                const d = val[k];
                // Handle inconsistent naming (latitude vs lat)
                return {
                    id: k,
                    zone: d.zoneId || d.zone || "Unassigned",
                    lat: d.latitude || d.lat,
                    lng: d.longitude || d.lng
                };
            });
            console.log("Beacons loaded:", beacons.length);
            updateUI();
        });

        db.ref("/Zones").on("value", snap => {
            const val = snap.val();
            zones = {};
            if(val) {
                Object.keys(val).forEach(k => {
                    if(val[k].centerLat) zones[k] = [val[k].centerLat, val[k].centerLng];
                });
            }
            updateUI();
        });

    } catch(e) {
        console.error("Firebase Error:", e);
        alert("Data connection failed. Check console.");
    }

    // 4. Setup Compass Visuals
    const dial = document.getElementById('finderDial');
    for(let i = 0; i < 360; i+=10) {
        const t = document.createElement('div');
        t.className = 'tick' + (i % 90 === 0 ? ' N' : '');
        t.style.transform = `rotate(${i}deg) translate(0, 10px)`;
        dial.appendChild(t);
    }

    // 5. Inject Icon into Card
    const iconHTML = document.getElementById('tpl-icon').innerHTML;
    if(document.getElementById('cardIconContainer')) document.getElementById('cardIconContainer').innerHTML = iconHTML;

    // 6. Attach Event Listeners
    setupEvents();
}

/* --- DATA & RENDER --- */
function updateUI() {
    const list = document.getElementById('homeList');
    const filter = document.getElementById('zoneFilter').value;
    
    // Filter List
    const filtered = beacons.filter(b => !filter || b.zone === filter);
    
    // Render List
    if(filtered.length === 0) {
        document.getElementById('homeEmpty').style.display = 'block';
        document.getElementById('homeEmpty').innerText = "No data available";
        list.innerHTML = '';
    } else {
        document.getElementById('homeEmpty').style.display = 'none';
        list.innerHTML = filtered.map(b => `
            <div class="item-card" onclick="viewOnMap('${b.id}')">
                <div class="item-img">${document.getElementById('tpl-icon').innerHTML}</div>
                <div style="flex:1">
                    <div style="font-weight:600;font-size:15px;">${b.zone}</div>
                    <div class="small muted">ID: ${b.id}</div>
                </div>
                <span style="opacity:0.3">→</span>
            </div>
        `).join('');
    }

    // Stats
    document.getElementById('statBeaconCount').innerText = beacons.length;
    document.getElementById('statZoneCount').innerText = Object.keys(zones).length;

    // Dropdown
    const sel = document.getElementById('zoneFilter');
    const currentVal = sel.value;
    const allZones = [...new Set([...beacons.map(b=>b.zone), ...Object.keys(zones)])].filter(Boolean).sort();
    sel.innerHTML = `<option value="">All Zones</option>` + allZones.map(z => `<option value="${z}">${z}</option>`).join('');
    sel.value = currentVal;

    // Map Markers
    clusters.clearLayers();
    beacons.forEach(b => {
        if(b.lat && b.lng) {
            const m = L.circleMarker([b.lat, b.lng], {
                radius: 8, color: '#F2994A', fillColor: '#F2994A', fillOpacity: 0.9, weight: 2
            });
            m.on('click', () => selectBeacon(b));
            clusters.addLayer(m);
        }
    });
}

/* --- EVENTS --- */
function setupEvents() {
    // Navigation Buttons
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
            if(btn.dataset.page === 'map') setTimeout(() => map.invalidateSize(), 300);
        };
    });

    // Theme Toggle (Fixed Logic)
    const toggle = document.getElementById('themeToggle');
    if(toggle) {
        toggle.onclick = (e) => { // use onclick for immediate feedback
            const isDark = e.target.checked;
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateMapTiles();
        };
    }

    // Modals
    document.getElementById('hdr-add').onclick = () => document.getElementById('modalAdd').style.display = 'flex';
    document.getElementById('btnAddZone').onclick = () => document.getElementById('modalZone').style.display = 'flex';

    // Map Interaction
    document.getElementById('mc_close').onclick = () => document.getElementById('mapCard').style.transform = 'translateY(150%)';
    document.getElementById('mc_find').onclick = startCompass;
    document.getElementById('btnStopFind').onclick = stopCompass;
}

/* --- MAP UTILS --- */
function updateMapTiles() {
    if(currentTileLayer) map.removeLayer(currentTileLayer);
    const isDark = document.body.classList.contains('dark');
    const url = isDark 
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' 
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
    currentTileLayer = L.tileLayer(url, { attribution: '© CartoDB', maxZoom: 20 }).addTo(map);
}

function viewOnMap(id) {
    const b = beacons.find(x => x.id === id);
    if(b) {
        document.querySelector('[data-page="map"]').click();
        setTimeout(() => selectBeacon(b), 400);
    }
}

function selectBeacon(b) {
    selectedBeacon = b;
    map.flyTo([b.lat, b.lng], 18);
    document.getElementById('mc_name').innerText = b.id;
    document.getElementById('mc_zone').innerText = b.zone;
    document.getElementById('mapCard').style.transform = 'translateY(0)';
}

function closeModals() {
    document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
}

/* --- COMPASS LOGIC --- */
function startCompass() {
    if(!selectedBeacon) return;
    document.getElementById('mapCard').style.transform = 'translateY(150%)';
    const overlay = document.getElementById('finder-overlay');
    overlay.style.display = 'flex';

    if(navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude } = pos.coords;
            const destLat = selectedBeacon.lat;
            const destLng = selectedBeacon.lng;
            
            // Distance Calculation
            const R = 6371e3;
            const φ1 = latitude * Math.PI/180, φ2 = destLat * Math.PI/180;
            const Δφ = (destLat-latitude) * Math.PI/180, Δλ = (destLng-longitude) * Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2) * Math.sin(Δλ/2)**2;
            const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            
            document.getElementById('findDistVal').innerText = Math.round(d);

            // Bearing Calculation
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

            // Rotate Dial (Simulated heading since DeviceOrientation is complex in browser)
            // Ideally: Rotation = Bearing - DeviceHeading. 
            // For this demo, assuming phone points North (0) or using random jitter to simulate life
            // If you test on mobile, adding deviceorientation is needed for full effect.
            
            const rotation = -bearing; // Rotate dial so target is "Up" relative to north
            document.getElementById('finderDial').style.transform = `rotate(${bearing}deg)`; 
            
        }, err => console.error(err), { enableHighAccuracy: true });
    }
}

function stopCompass() {
    document.getElementById('finder-overlay').style.display = 'none';
    if(watchId) navigator.geolocation.clearWatch(watchId);
}

// Boot
window.onload = init;
</script>
</body>
