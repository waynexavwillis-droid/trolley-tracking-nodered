<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trolley Tracker • Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database-compat.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  /* App Colors - Dark Mode Default */
  --bg-app: #0f0f11;
  --bg-panel: #1c1c1e;
  --bg-card: #262629;
  
  --text-main: #ffffff;
  --text-muted: #9ca3af;
  
  --accent: #F2994A; 
  --accent-grad: linear-gradient(135deg, #F2994A 0%, #F2C94C 100%);
  --bluetooth: #007AFF;
  
  --danger: #ff453a;
  --glass: rgba(20, 20, 20, 0.65);
  --glass-border: rgba(255,255,255,0.08);
  
  --radius-l: 32px;
  --radius-m: 20px;
  
  --anim: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* --- SVG Icon Class --- */
.trolley-icon-svg {
    width: 100%; height: 100%;
    display: block;
}

/* --- Typography --- */
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.02em; }
.small { font-size: 13px; }
.muted { color: var(--text-muted); }
.pill {
  padding: 4px 12px;
  background: rgba(255,255,255,0.1);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  backdrop-filter: blur(4px);
}

/* --- Buttons & Inputs --- */
button { border: none; cursor: pointer; font-family: inherit; transition: var(--anim); outline: none; }
button:active { transform: scale(0.96); }

.btn-primary {
  background: var(--accent-grad); color: black;
  padding: 12px 24px; border-radius: 100px;
  font-weight: 700; font-size: 14px;
  box-shadow: 0 8px 20px rgba(242, 153, 74, 0.3);
}
.btn-ghost {
  background: rgba(255,255,255,0.08); color: var(--text-main);
  padding: 10px 20px; border-radius: 100px;
  font-size: 13px; font-weight: 500;
}
.btn-blue {
    background: var(--bluetooth); color: white;
    padding: 12px 24px; border-radius: 100px;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
}

.btn-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

input, select {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.05);
  color: white; padding: 14px 18px;
  border-radius: var(--radius-m); width: 100%;
  font-size: 14px; outline: none;
}

/* --- Header --- */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 16px 20px;
  background: linear-gradient(180deg, var(--bg-app) 0%, rgba(15,15,17,0.9) 80%, transparent 100%);
  display: flex; align-items: center; justify-content: space-between;
}

/* --- Pages --- */
.page {
  position: absolute; inset: 0;
  padding: 80px 20px 100px 20px;
  overflow-y: auto;
  opacity: 0; visibility: hidden; transform: scale(0.98);
  transition: var(--anim);
}
.page.active { opacity: 1; visibility: visible; transform: scale(1); }

/* --- Cards & Lists --- */
.app-card {
  background: var(--bg-panel); border-radius: var(--radius-l);
  padding: 20px; margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.03);
}
.list-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.item-card {
  background: var(--bg-card); border-radius: var(--radius-m);
  padding: 12px; display: flex; align-items: center; gap: 14px;
  transition: var(--anim); cursor: pointer; border: 1px solid transparent;
}
.item-card:hover { background: #323236; border-color: rgba(242, 153, 74, 0.3); }
.item-img {
  width: 60px; height: 60px; border-radius: 16px;
  background: linear-gradient(135deg, #2a2a2d, #1f1f22);
  padding: 8px;
  display: flex; align-items: center; justify-content: center;
}

.item-content { flex: 1; }
.item-title { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.item-sub { font-size: 12px; color: var(--text-muted); }
.item-action {
  background: var(--accent-grad); color: black;
  width: 36px; height: 36px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
}

/* --- Map --- */
#map-container {
  width: 100%; height: 100%;
  border-radius: var(--radius-l); overflow: hidden; position: relative;
  border: 1px solid rgba(255,255,255,0.05);
}
#map { width: 100%; height: 100%; background: #121212; }

/* --- Custom Tooltip Style (CARD LAYOUT) --- */
.custom-tooltip {
    background: rgba(28, 28, 30, 0.85) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px !important;
    padding: 0 !important; /* We handle padding internally */
    box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important;
    color: white !important;
    font-family: 'Inter', sans-serif !important;
    min-width: 220px;
    opacity: 1 !important;
    z-index: 2000 !important;
}
/* Remove default arrow */
.leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
    display: none !important;
}

/* Tooltip Internal Layout */
.tt-card { display: flex; flex-direction: column; }
.tt-header { 
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.tt-title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.tt-badge { 
    padding: 4px 10px; border-radius: 100px; 
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
}
.tt-badge.active { background: rgba(50, 209, 88, 0.15); color: #32d158; box-shadow: 0 0 10px rgba(50, 209, 88, 0.2); }
.tt-badge.inactive { background: rgba(255, 69, 58, 0.15); color: #ff453a; }

.tt-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.tt-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.tt-label { color: #9ca3af; font-weight: 500; }
.tt-value { font-weight: 600; color: white; font-family: 'Monaco', monospace; }

.tt-footer {
    background: rgba(0,0,0,0.2);
    padding: 8px 16px;
    font-size: 10px;
    color: #666;
    border-radius: 0 0 20px 20px;
    display: flex; justify-content: space-between;
    font-weight: 500;
}

/* --- Stats Grid --- */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-box {
  background: var(--bg-card); border-radius: var(--radius-m);
  padding: 16px; display: flex; flex-direction: column; gap: 6px;
}
.stat-val { font-size: 28px; font-weight: 800; color: var(--text-main); }
.stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* --- Bottom Nav --- */
.nav-dock {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(30, 30, 32, 0.8); backdrop-filter: blur(16px);
  padding: 6px; border-radius: 100px;
  display: flex; gap: 4px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6); z-index: 100;
  border: 1px solid rgba(255,255,255,0.08);
}
.nav-item {
  padding: 10px 20px; border-radius: 100px;
  color: #8e8e93; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--anim);
}
.nav-item.active { background: var(--text-main); color: black; box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
.nav-item span { display: none; font-size: 12px; font-weight: 600; margin-left: 6px; }
.nav-item.active span { display: block; }

/* --- NEW FINDER UI ("Flight Details" Style) --- */
#finder-overlay {
    position: fixed; inset: 0; z-index: 2000;
    pointer-events: none; /* Let clicks pass to map when not on panel */
    display: none;
    flex-direction: column;
    justify-content: flex-end;
}

/* The Glass Panel */
.finder-panel {
    pointer-events: auto;
    position: relative;
    margin: 0 16px 16px 16px;
    height: 70vh;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 40px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
}

#finder-overlay.active .finder-panel {
    transform: translateY(0);
}

/* Toggle Pills (Speed/Height style) */
.finder-toggles {
    background: rgba(0,0,0,0.25);
    border-radius: 20px;
    padding: 4px;
    display: flex;
    gap: 4px;
    margin-bottom: 30px;
}
.finder-toggle-btn {
    padding: 10px 24px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 500;
    color: #888;
    background: transparent;
}
.finder-toggle-btn.active {
    background: rgba(255,255,255,0.15);
    color: white;
    font-weight: 600;
}

/* Main Data Display */
.finder-data-display {
    text-align: center;
    margin-bottom: auto;
}
.finder-value {
    font-size: 80px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
.finder-unit {
    font-size: 24px;
    font-weight: 400;
    color: #aaa;
    margin-left: 4px;
}

/* Compass Visual */
.finder-compass-wrapper {
    width: 140px; height: 140px;
    margin-bottom: 20px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
}
.compass-bg {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
}
.compass-arrow {
    width: 40px; height: 100px;
    background: linear-gradient(to bottom, #ff3b30 50%, #ccc 50%);
    clip-path: polygon(50% 0, 100% 100%, 50% 85%, 0% 100%);
    border-radius: 4px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.1s linear;
}

/* Floating Close Button (White Circle) */
.finder-close-btn {
    width: 64px; height: 64px;
    background: white;
    border-radius: 50%;
    color: black;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 2002;
}
.finder-close-btn:active { transform: translateX(-50%) scale(0.9); }

/* --- Modals --- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
}
.modal-content {
  background: var(--bg-panel); width: 90%; max-width: 400px;
  border-radius: var(--radius-l); padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  border: 1px solid rgba(255,255,255,0.05);
}

/* Code Block for Raw Data (Bottom Card) */
.raw-data-container {
    background: #111;
    padding: 12px;
    border-radius: 12px;
    font-family: monospace;
    font-size: 11px;
    color: #0f0;
    max-height: 150px;
    overflow-y: auto;
    white-space: pre-wrap;
    border: 1px solid #333;
    margin-top: 10px;
    display: none;
}
.raw-data-container.show { display: block; }

/* Leaflet Tweaks */
.leaflet-container { background: #121212 !important; }
.leaflet-popup-content-wrapper { background: var(--bg-panel); color: white; border-radius: 12px; }
.leaflet-popup-tip { background: var(--bg-panel); }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:32px;height:32px;background:var(--accent-grad);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:black;">T</div>
    <h1 style="font-size:18px;">Trolley<span style="color:var(--accent)">Map</span></h1>
  </div>
  <div style="display:flex;gap:8px;">
    <!-- REMOVED GLOBAL BLE BUTTON HERE AS REQUESTED -->
    <button id="hdr-add" class="btn-ghost" style="padding:8px 12px;">+ Add</button>
  </div>
</header>

<!-- TROLLEY ICON TEMPLATE (Red Handle) -->
<template id="tpl-icon">
    <svg class="trolley-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 5H21" stroke="#FF453A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M16 5H19L18.5 7" stroke="#FF453A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M4 6h14l-1.5 9h-11L4 6z" stroke="#E0E0E0" stroke-width="1.5"/>
        <path d="M5.5 9h11" stroke="#E0E0E0" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M5 12h10" stroke="#E0E0E0" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M8 6v9" stroke="#E0E0E0" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M11 6v9" stroke="#E0E0E0" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M14 6v9" stroke="#E0E0E0" stroke-width="1" stroke-opacity="0.5"/>
        <path d="M1 2h3l3.5 16h11" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="8" cy="20" r="1.5" fill="#888"/>
        <circle cx="17" cy="20" r="1.5" fill="#888"/>
    </svg>
</template>

<!-- 1. HOME PAGE -->
<div id="page-home" class="page active">
  <div class="app-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3>Overview</h3>
      <span class="pill" style="color:var(--accent)">Live Updates</span>
    </div>
    
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-label">Active Trolleys</span>
        <span class="stat-val" id="statBeaconCount">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Active Zones</span>
        <span class="stat-val" id="statZoneCount">0</span>
      </div>
    </div>

    <div style="position:relative;">
        <select id="zoneFilter">
            <option value="">All Zones</option>
        </select>
        <div style="position:absolute;right:14px;top:14px;pointer-events:none;font-size:10px;">▼</div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;">
    <h3 style="font-size:18px;">Recent Trolleys</h3>
    <span class="small muted" id="listCount">0 items</span>
  </div>

  <div id="homeList" class="list-grid"></div>
  <div id="homeEmpty" class="muted small" style="text-align:center;padding:20px;">No trolleys found.</div>
</div>

<!-- 2. MAP PAGE -->
<div id="page-map" class="page" style="padding:0;">
  <div id="map-container">
    <div id="map"></div>
    
    <div style="position:absolute;top:80px;left:20px;right:20px;z-index:500;display:flex;gap:8px;">
      <input id="mapSearch" placeholder="Search ID or Zone..." style="background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,0.3);">
      <button id="mapRecenter" class="btn-icon" style="background:rgba(28,28,30,0.9);color:var(--accent);flex-shrink:0;">⌖</button>
    </div>

    <!-- Selected Beacon Card (Bottom Sheet) -->
    <div id="mapCard" class="app-card" style="position:absolute;bottom:100px;left:20px;right:20px;z-index:500;margin:0;transform:translateY(150%);transition:transform 0.4s ease;background:rgba(28,28,30,0.95); max-height: 60%; overflow-y:auto;">
        <div style="display:flex;gap:14px;">
            <div class="item-img" id="cardIconContainer" style="width:50px;height:50px;">
                <!-- Icon injected here -->
            </div>
            <div style="flex:1;">
                <div id="mc_name" style="font-weight:700;font-size:16px;">Trolley Name</div>
                <div id="mc_zone" class="small muted">Zone Info</div>
            </div>
            <button id="mc_close" class="btn-ghost" style="width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:12px 0;">
        <div style="display:flex;gap:10px;">
            <!-- Renamed "Fly Details" to "Track" -->
            <button id="mc_find" class="btn-primary" style="flex:1;">Track</button>
            <button id="mc_toggle_raw" class="btn-ghost" style="font-size:11px;">Tech Data</button>
            <button id="mc_del" class="btn-ghost" style="color:var(--danger);">Del</button>
        </div>
        <!-- Raw Data View -->
        <div id="mc_raw_content" class="raw-data-container">
            Scanning Firebase...
        </div>
    </div>
  </div>
</div>

<!-- 3. SETTINGS PAGE -->
<div id="page-settings" class="page">
    <div class="app-card">
        <h3>Management</h3>
        <p class="muted small" style="margin-bottom:20px;">Manage your fleet configuration.</p>
        
        <button id="btnAddZone" class="item-card" style="width:100%;margin-bottom:10px;">
            <div class="item-img" style="background:#333;">🔵</div>
            <div class="item-content">
                <div class="item-title">Add New Zone</div>
                <div class="item-sub">Create geofenced areas</div>
            </div>
            <div style="opacity:0.5;">→</div>
        </button>

        <button id="btnRefresh" class="item-card" style="width:100%;">
            <div class="item-img" style="background:#333;">↻</div>
            <div class="item-content">
                <div class="item-title">Sync Data</div>
                <div class="item-sub" id="lastSyncText">Last sync: Never</div>
            </div>
        </button>
    </div>
</div>

<!-- Navigation Dock -->
<nav class="nav-dock">
  <button class="nav-item active" data-page="home">🏠<span>Home</span></button>
  <button class="nav-item" data-page="map">🗺️<span>Map</span></button>
  <button class="nav-item" data-page="settings">⚙️<span>Settings</span></button>
</nav>

<!-- MODALS -->
<div id="modalAdd" class="modal-backdrop">
    <div class="modal-content">
        <h3 style="margin-bottom:16px;">New Beacon</h3>
        <label class="small muted">Zone ID</label>
        <input id="inpZone" placeholder="e.g. ARRIVAL-A" style="margin-bottom:12px;">
        <label class="small muted">Trolley ID</label>
        <input id="inpId" placeholder="e.g. T-001">
        <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
            <button class="btn-ghost" onclick="closeModals()">Cancel</button>
            <button class="btn-primary" id="btnAddConfirm">Place on Map</button>
        </div>
    </div>
</div>

<div id="modalZone" class="modal-backdrop">
    <div class="modal-content">
        <h3 style="margin-bottom:16px;">New Zone</h3>
        <label class="small muted">Zone Name</label>
        <input id="inpZoneName" placeholder="e.g. PARKING-B1">
        <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
            <button class="btn-ghost" onclick="closeModals()">Cancel</button>
            <button class="btn-primary" id="btnAddZoneConfirm">Set Center</button>
        </div>
    </div>
</div>

<!-- NEW FINDER OVERLAY -->
<div id="finder-overlay">
    <div class="finder-panel">
        <div style="margin-bottom:20px;font-size:18px;font-weight:600;color:white;opacity:0.9;" id="findTargetName">Trolley Details</div>

        <!-- Toggles -->
        <div class="finder-toggles">
            <div class="finder-toggle-btn active">Distance</div>
            <div class="finder-toggle-btn">Compass</div>
        </div>

        <!-- Data -->
        <div class="finder-data-display">
            <span class="finder-value" id="findDistVal">--</span>
            <span class="finder-unit">m</span>
        </div>

        <!-- Compass Visual -->
        <div class="finder-compass-wrapper">
            <div class="compass-bg"></div>
            <div class="compass-arrow" id="finderArrow"></div>
        </div>

        <!-- NEW: Specific BLE Scan Button inside "Track" overlay -->
        <button id="btnFinderBle" class="btn-blue" style="margin-bottom: 20px;">
            📡 Scan for Signal
        </button>

        <!-- Ticks visual (now smaller to fit) -->
        <div style="display:flex;gap:10px;opacity:0.3;margin-top:auto;margin-bottom:40px;">
            <div style="width:2px;height:10px;background:white;"></div>
            <div style="width:2px;height:15px;background:white;"></div>
            <div style="width:2px;height:25px;background:white;"></div>
            <div style="width:2px;height:15px;background:white;"></div>
            <div style="width:2px;height:10px;background:white;"></div>
        </div>

        <button class="finder-close-btn" id="btnStopFind">✕</button>
    </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;top:20px;left:50%;transform:translate(-50%, -100px);background:white;color:black;padding:10px 20px;border-radius:50px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:0.4s;z-index:3000;">Notification</div>

<script>
// --- Logic ---
const FIXED_ZONE_RADIUS = 50;

let map = null;
let clusters = null;
let beacons = [];
let zones = {};
let idToMarker = new Map();
let zoneCircles = {};
let selectedBeacon = null;
let placementMode = null;
let tempPayload = null;
let watchId = null;

// User Location
let userMarker = null;
let userLat = null;
let userLng = null;

// Get Trolley SVG String
const getTrolleyIcon = () => document.getElementById('tpl-icon').innerHTML;

function init(){
    // Map
    map = L.map('map', { zoomControl: false }).setView([1.3455, 103.9323], 17);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OSM &copy; CartoDB', subdomains: 'abcd', maxZoom: 20
    }).addTo(map);
    clusters = L.markerClusterGroup({ showCoverageOnHover: false, disableClusteringAtZoom: 19 });
    map.addLayer(clusters);

    // Inject Icon into Map Card
    document.getElementById('cardIconContainer').innerHTML = getTrolleyIcon();

    // Firebase
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyCYE1hpoQV_QlfhQz7hlZResGuunbY1DG0",
            authDomain: "trolley-tracking-678c5.firebaseapp.com",
            databaseURL: "https://trolley-tracking-678c5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "trolley-tracking-678c5",
            storageBucket: "trolley-tracking-678c5.appspot.com",
            messagingSenderId: "830477552391",
            appId: "1:830477552391:web:558930d01a8f594a3953a2"
        };
        if (firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        db.ref("/Tracking").on("value", snap => {
            const data = snap.val() || {};
            beacons = Object.keys(data).map(k => {
                const v = data[k];
                return {
                    id: k,
                    name: v.zoneId ? `${v.zoneId} • ${k}` : k,
                    zone: v.zoneId || "",
                    lat: v.latitude || v.lat,
                    lng: v.longitude || v.lng,
                    raw: v // STORE RAW FIREBASE DATA HERE
                };
            });
            updateUI();
        });

        db.ref("/Zones").on("value", snap => {
            const data = snap.val() || {};
            zones = {};
            Object.keys(data).forEach(k => {
                if(data[k].centerLat) zones[k] = [data[k].centerLat, data[k].centerLng];
            });
            updateUI();
        });
    } catch(e) { console.error(e); showToast("Firebase Error"); }

    // START GEO TRACKING FOR "MY LOCATION"
    if(navigator.geolocation) {
        navigator.geolocation.watchPosition(
            (pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                
                if(!userMarker) {
                    // Create User Blue Dot Marker
                    userMarker = L.circleMarker([userLat, userLng], {
                        radius: 8,
                        color: '#FFF',
                        fillColor: '#007AFF',
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(map);
                    userMarker.bindPopup("You are here");
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            },
            (err) => console.warn("Location access denied"),
            { enableHighAccuracy: true }
        );
    }

    setupInteractions();
}

function updateUI(){
    renderList();
    renderMap();
    document.getElementById("statBeaconCount").innerText = beacons.length;
    document.getElementById("statZoneCount").innerText = Object.keys(zones).length || new Set(beacons.map(b=>b.zone)).size;
    document.getElementById('lastSyncText').innerText = "Last sync: " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function renderList(){
    const listEl = document.getElementById("homeList");
    const filter = document.getElementById("zoneFilter").value;
    const filtered = beacons.filter(b => !filter || b.zone === filter);
    
    document.getElementById("listCount").innerText = `${filtered.length} items`;
    document.getElementById("homeEmpty").style.display = filtered.length ? 'none' : 'block';
    
    listEl.innerHTML = filtered.map(b => `
        <div class="item-card" onclick="viewOnMap('${b.id}')">
            <div class="item-img">${getTrolleyIcon()}</div>
            <div class="item-content">
                <div class="item-title">${b.zone || 'Unassigned'}</div>
                <div class="item-sub">ID: ${b.id}</div>
            </div>
            <div class="item-action">→</div>
        </div>
    `).join('');

    const sel = document.getElementById("zoneFilter");
    const knownZones = [...new Set([...beacons.map(b=>b.zone), ...Object.keys(zones)])].filter(Boolean).sort();
    const curr = sel.value;
    sel.innerHTML = `<option value="">All Zones</option>` + knownZones.map(z => `<option value="${z}">${z}</option>`).join('');
    sel.value = curr;
}

function renderMap(){
    clusters.clearLayers();
    idToMarker.clear();
    
    const zoneFilter = document.getElementById("zoneFilter").value;

    beacons.forEach(b => {
        if(zoneFilter && b.zone !== zoneFilter) return;

        if(selectedBeacon && b.id !== selectedBeacon.id) return;

        if(!b.lat || !b.lng) return;
        const m = L.circleMarker([b.lat, b.lng], {
            radius: 8, color: '#FF453A', fillColor: '#FF453A', fillOpacity: 0.9, weight: 2
        });
        
        // --- TOOLTIP CARD ---
        const lastSeen = b.raw.timestamp ? new Date(b.raw.timestamp) : new Date();
        const timeStr = lastSeen.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const isRecent = (Date.now() - lastSeen.getTime()) < 1000 * 60 * 60; 

        const tooltipHtml = `
            <div class="tt-card">
                <div class="tt-header">
                    <div class="tt-title">Trolley ${b.id}</div>
                    <div class="tt-badge ${isRecent ? 'active' : 'inactive'}">${isRecent ? 'Active' : 'Offline'}</div>
                </div>
                <div class="tt-body">
                    <div class="tt-row">
                        <span class="tt-label">Zone</span>
                        <span class="tt-value">${b.zone || 'Unknown'}</span>
                    </div>
                    <div class="tt-row">
                        <span class="tt-label">Signal Strength</span>
                        <span class="tt-value">${b.raw.rssi ? b.raw.rssi + ' dBm' : 'N/A'}</span>
                    </div>
                    <div class="tt-row">
                        <span class="tt-label">Battery Level</span>
                        <span class="tt-value" style="color:${b.raw.battery > 20 ? '#32d158' : '#ff453a'}">
                            ${b.raw.battery ? b.raw.battery + '%' : 'N/A'}
                        </span>
                    </div>
                </div>
                <div class="tt-footer">
                    <span>🕒 ${timeStr}</span>
                    <span style="opacity:0.6">${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}</span>
                </div>
            </div>
        `;
        
        m.bindTooltip(tooltipHtml, {
            direction: 'top',
            className: 'custom-tooltip',
            opacity: 1,
            offset: [0, -12]
        });
        
        m.on('click', (e) => {
             L.DomEvent.stopPropagation(e); 
             selectBeacon(b);
        });

        clusters.addLayer(m);
        idToMarker.set(b.id, m);
    });

    if(userMarker) userMarker.addTo(map);

    Object.keys(zoneCircles).forEach(k => map.removeLayer(zoneCircles[k]));
    zoneCircles = {};
    
    if(!selectedBeacon) {
        Object.keys(zones).forEach(zKey => {
            if(zoneFilter && zoneFilter !== zKey) return;
            zoneCircles[zKey] = L.circle(zones[zKey], {
                radius: FIXED_ZONE_RADIUS, color: '#30d158', fillColor: '#30d158', fillOpacity: 0.1, weight: 1, dashArray: '5, 5'
            }).addTo(map);
        });
    }
}

// --- TARGETED BLE SCANNER LOGIC ---
async function scanTargetBeacon() {
    if (!selectedBeacon) return;

    if (!window.isSecureContext) {
        alert("Web Bluetooth requires HTTPS or localhost.");
        return;
    }
    if (!navigator.bluetooth) {
        alert("Browser not supported. Use Chrome (Android/Desktop) or Bluefy (iOS).");
        return;
    }

    try {
        const targetName = selectedBeacon.id; // We filter for the exact ID
        showToast(`Scanning for ${targetName}...`);
        
        // Filter specifically for this trolley's ID
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: targetName }]
            // Note: If the device advertises a name different from its ID, this filter will fail.
            // In that case, switch to { acceptAllDevices: true } and check name manually.
        });

        showToast(`Connected to ${device.name}!`);
        
        if(!userLat || !userLng) {
            alert("Waiting for GPS signal to update location...");
            return;
        }

        // Update Firebase with CURRENT user location (Phone is now the scanner)
        const updates = {
            latitude: userLat,
            longitude: userLng,
            timestamp: new Date().toISOString(),
            lastSeenBy: "Manual-Track-Scan",
            rssi: -40 // Mock RSSI as "Near" since we just connected
        };
        
        await firebase.database().ref(`/Tracking/${selectedBeacon.id}`).update(updates);
        
        showToast("Location Updated Successfully!");
        // Refresh Compass Target
        selectedBeacon.lat = userLat;
        selectedBeacon.lng = userLng;
        renderMap();

    } catch (error) {
        console.log('BLE Error: ' + error);
        if(error.name === 'NotFoundError') {
            showToast("Device not found nearby.");
        } else {
            alert("Scan Error: " + error.message);
        }
    }
}

function setupInteractions(){
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
            if(btn.dataset.page === 'map') setTimeout(()=> map.invalidateSize(), 300);
        };
    });

    document.getElementById('hdr-add').onclick = () => document.getElementById('modalAdd').style.display = 'flex';
    
    // Bind New BLE Button inside overlay
    document.getElementById('btnFinderBle').onclick = scanTargetBeacon;

    document.getElementById('btnAddZone').onclick = () => document.getElementById('modalZone').style.display = 'flex';
    
    document.getElementById('btnAddConfirm').onclick = () => {
        const z = document.getElementById('inpZone').value;
        const id = document.getElementById('inpId').value;
        if(!z || !id) return showToast("Fill all fields");
        tempPayload = { zoneId: z, trolleyId: id };
        placementMode = 'beacon';
        closeModals();
        switchToMapAndGuide("Tap map to place trolley");
    };

    document.getElementById('btnAddZoneConfirm').onclick = () => {
        const z = document.getElementById('inpZoneName').value;
        if(!z) return showToast("Name required");
        tempPayload = { zoneId: z };
        placementMode = 'zone';
        closeModals();
        switchToMapAndGuide("Tap map to set zone center");
    };

    map.on('click', e => {
        if(placementMode){
            const { lat, lng } = e.latlng;
            if(placementMode === 'beacon'){
                firebase.database().ref(`/Tracking/${tempPayload.trolleyId}`).set({
                    ...tempPayload, latitude: lat, longitude: lng, timestamp: new Date().toISOString()
                });
                showToast("Beacon Added!");
            } else if (placementMode === 'zone'){
                firebase.database().ref(`/Zones/${tempPayload.zoneId}`).set({
                    zoneId: tempPayload.zoneId, centerLat: lat, centerLng: lng
                });
                showToast("Zone Created!");
            }
            placementMode = null;
            return;
        }

        if(selectedBeacon) {
            deselectBeacon();
        }
    });

    document.getElementById('mapSearch').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const found = beacons.find(b => b.id.toLowerCase().includes(term) || b.zone.toLowerCase().includes(term));
        if(found) selectBeacon(found);
    };
    
    document.getElementById('mc_close').onclick = deselectBeacon;

    document.getElementById('mc_del').onclick = () => {
        if(confirm("Delete this beacon?")){
            firebase.database().ref(`/Tracking/${selectedBeacon.id}`).remove();
            deselectBeacon();
        }
    };

    document.getElementById('mc_toggle_raw').onclick = () => {
        const el = document.getElementById('mc_raw_content');
        el.classList.toggle('show');
    };

    document.getElementById('mc_find').onclick = startCompass;
    document.getElementById('zoneFilter').onchange = updateUI;

    document.getElementById('mapRecenter').onclick = () => {
        if(userLat && userLng) {
            map.flyTo([userLat, userLng], 18);
            showToast("Locating you...");
        } else {
            showToast("Waiting for GPS...");
        }
    };
}

function switchToMapAndGuide(msg){
    document.querySelector('[data-page="map"]').click();
    showToast(msg);
}
function viewOnMap(id){
    const b = beacons.find(x => x.id === id);
    if(b){
        document.querySelector('[data-page="map"]').click();
        setTimeout(() => selectBeacon(b), 400);
    }
}

function selectBeacon(b){
    selectedBeacon = b;
    map.flyTo([b.lat, b.lng], 18);
    
    document.getElementById('mc_name').innerText = b.id;
    document.getElementById('mc_zone').innerText = b.zone || "No Zone";
    
    document.getElementById('mc_raw_content').innerText = JSON.stringify(b.raw, null, 2);
    document.getElementById('mc_raw_content').classList.remove('show');

    document.getElementById('mapCard').style.transform = 'translateY(0)';
    renderMap();
}

function deselectBeacon(){
    selectedBeacon = null;
    document.getElementById('mapCard').style.transform = 'translateY(150%)';
    renderMap();
}

function closeModals(){ document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none'); }
function showToast(msg){
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.transform = 'translate(-50%, 20px)';
    setTimeout(() => t.style.transform = 'translate(-50%, -100px)', 3000);
}

// --- COMPASS LOGIC ---
function startCompass(){
    if(!selectedBeacon) return;
    
    document.getElementById('mapCard').style.transform = 'translateY(150%)';
    const overlay = document.getElementById('finder-overlay');
    overlay.style.display = 'flex';
    
    requestAnimationFrame(() => {
        overlay.classList.add('active');
    });

    document.getElementById('findTargetName').innerText = "Tracking: " + selectedBeacon.id;

    if(navigator.geolocation){
        watchId = navigator.geolocation.watchPosition(processPosition, console.error, {enableHighAccuracy:true});
        window.addEventListener('deviceorientation', processOrientation, true);
    }
}

document.getElementById('btnStopFind').onclick = () => {
    const overlay = document.getElementById('finder-overlay');
    overlay.classList.remove('active');
    
    setTimeout(() => {
        overlay.style.display = 'none';
    }, 500); 

    if(selectedBeacon) document.getElementById('mapCard').style.transform = 'translateY(0)';

    if(watchId) navigator.geolocation.clearWatch(watchId);
    window.removeEventListener('deviceorientation', processOrientation);
};

let currentHeading = 0;
function processOrientation(e){
    if(e.webkitCompassHeading) currentHeading = e.webkitCompassHeading;
    else if(e.alpha) currentHeading = 360 - e.alpha;
}
function processPosition(pos){
    const { latitude, longitude } = pos.coords;
    userLat = latitude; 
    userLng = longitude;

    const destLat = selectedBeacon.lat;
    const destLng = selectedBeacon.lng;
    
    const R = 6371e3;
    const φ1 = latitude * Math.PI/180, φ2 = destLat * Math.PI/180;
    const Δφ = (destLat-latitude) * Math.PI/180, Δλ = (destLng-longitude) * Math.PI/180;
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2) * Math.sin(Δλ/2)**2;
    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    
    document.getElementById('findDistVal').innerText = Math.round(d);

    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    const rotation = brng - currentHeading;
    
    document.getElementById('finderArrow').style.transform = `rotate(${rotation}deg)`;
}

window.onload = init;
</script>
</body>
</html>
